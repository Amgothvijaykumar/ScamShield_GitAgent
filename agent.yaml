spec_version: "0.1.0"
name: scamshield-agent
version: 1.0.0
description: "Analyzes suspicious SMS, emails, and links to detect scams with a risk score and plain-language explanation"
author: "Amgoth Vijay Kumar"
license: MIT

model:
  preferred: google:gemini-2.0-flash
  fallback:
    - anthropic:claude-sonnet-4-5-20250929
    - openai:gpt-4o
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - parse-input
  - analyze-signals
  - classify-threat
  - explain-verdict

tools:
  - url-extractor

runtime:
  max_turns: 20
  timeout: 60

tags:
  - security
  - safety
  - scam-detection
  - india
  - open-innovation
  - hackathon
  - upi-fraud
  - consumer-protection

metadata:
  region: "India"
  hackathon: "GitAgent Open Innovation Hackathon 2025"
  demo_input: "examples/upi-lottery.txt"
